release:
  name: 📦 Release
  runs-on: ubuntu-latest
  needs: [build, test]
  if: github.ref == 'refs/heads/main'
  
  steps:
    - name: Grab the code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-output
    
    - name: Extract build output
      run: |
        echo "📁 Downloaded:"
        ls -la
        tar -xzf next-build.tar.gz
        echo ""
        echo "📁 Extracted .next:"
        ls -la .next/
    
    - name: Create deployment package
      run: |
        mkdir -p deploy-package
        cp -r .next deploy-package/
        cp package.json deploy-package/
        cp package-lock.json deploy-package/
        cp -r prisma deploy-package/ 2>/dev/null || true
        cp -r public deploy-package/ 2>/dev/null || true
        cd deploy-package
        zip -r ../deploy-bundle.zip .
        echo "📦 Deployment package:"
        ls -lh ../deploy-bundle.zip
    
    - name: Version Bump
      id: version
      uses: phips28/gh-action-bump-version@master
      with:
        tag-prefix: 'v'
        major-wording: 'MAJOR,breaking'
        minor-wording: 'minor,feature'
        patch-wording: 'patch,fixes,chore'
        commit-message: 'CI: bump version to {{version}} [skip ci]'
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: deploy-bundle.zip
        tag_name: ${{ steps.version.outputs.newTag }}
        name: Release ${{ steps.version.outputs.newTag }}
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}