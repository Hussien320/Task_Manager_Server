name: StockPulse CI/CD

on:
  push:
    branches:
      - '**'  # Runs on all branches

permissions:
  contents: write

jobs:
  # ============ BUILD JOB ============
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Grab the code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Build the app
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/

  # ============ TEST JOB ============
  test:
    runs-on: ubuntu-latest
    needs: build  # Only runs if build passes
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Grab the code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockpulse_test
      
      - name: Run tests with coverage
        run: npm run test:coverage
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ============ RELEASE JOB ============
  release:
    runs-on: ubuntu-latest
    needs: [test]  # Only runs if tests pass
    if: github.ref == 'refs/heads/main'  # Only executes on main branch
    
    steps:
      - name: Grab the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for version bump
      
      # 🔥 Retrieve build artifacts
      - name: Retrieve build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r .next deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          cp -r prisma deploy-package/ 2>/dev/null || true
          cp -r public deploy-package/ 2>/dev/null || true
          cd deploy-package
          zip -r ../deploy-bundle.zip .

      - name: Version Bump
        id: version
        uses: phips28/gh-action-bump-version@master
        with:
          tag-prefix: 'v'
          major-wording: 'MAJOR,breaking'
          minor-wording: 'minor,feature'
          patch-wording: 'patch,fixes,chore'
          commit-message: 'CI: bump version to {{version}} [skip ci]'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: deploy-bundle.zip
          tag_name: ${{ steps.version.outputs.newTag }}
          name: Release ${{ steps.version.outputs.newTag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}